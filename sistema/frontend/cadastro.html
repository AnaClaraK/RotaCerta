<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="stylecad.css">
</head>
<body>
    <div class="container">
        <div class="cadastro">
            <div class="servicos-section">
                <img src="caminhao2.jpg" alt="Caminhão" class="caminhao2">
                <img src="aviao.jpg" alt="Avião" class="aviao">
            </div>
        </div>
        <div class="image"></div>
        <div class="quadrado">
            <div class="container-respostas">
                <p class="lb_contrate">Contrate nosso <br> serviço</p>
                <br>
                <br>
                <label for="empresa">Empresa</label>
                <input type="text" id="empresa" placeholder="Nome da empresa">
                <br>
                <br>
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" placeholder="99 999999999">
                <br>
                <br>
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="00000000000">
                <br>
                <br>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="seu.email@dominio.com">
                <br>
                <br>
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Mínimo 6 caracteres">
                <br>
                <br>
                <div class="container-fim">
                    <p id="respostas" class="respostas"></p>
                </div>
                <button id="btn_cadastrar" class="btn_cadastrar">Cadastrar</button>
            </div>
        </div>

        <div class="triangulo"></div>
        <div class="cabecalho">
            <nav class="nav-bar">
                <div class="logo">
                    <img src="logo.png" alt="Rota-Certa Logística" class="logo-image">
                </div>
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li><a href="cadastro.html">Trabalhe Conosco</a></li>
                    <li class="login"><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <script>
        const PORTA = 3000;
        const API_URL = `http://localhost:${PORTA}/cadastro`;

        function clearFormFields() {
            document.getElementById("empresa").value = "";
            document.getElementById("telefone").value = "";
            document.getElementById("cpf").value = "";
            document.getElementById("email").value = "";
            document.getElementById("senha").value = "";
            
            const pMessageEl = document.getElementById("respostas");
            const containerFimEl = document.querySelector(".container-fim");
            
            pMessageEl.innerText = "";
            containerFimEl.classList.remove('container-fim-success', 'container-fim-error');
        }

        document.getElementById("btn_cadastrar").addEventListener("click", async () => {
            const cpf = document.getElementById("cpf").value.trim();
            const empresa = document.getElementById("empresa").value.trim();
            const telefone = document.getElementById("telefone").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value.trim();
            
            const pMessageEl = document.getElementById("respostas");
            const containerFimEl = document.querySelector(".container-fim");

            containerFimEl.classList.remove('container-fim-success', 'container-fim-error');
            pMessageEl.innerText = "Processando cadastro..."; 
            containerFimEl.classList.add('container-fim-success'); 

            if (!cpf || !empresa || !telefone || !email || !senha) {
                pMessageEl.innerText = "Preencha todos os campos.";
                containerFimEl.classList.remove('container-fim-success');
                containerFimEl.classList.add('container-fim-error');
                return;
            }

            try {
                const resposta = await fetch(API_URL, { 
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ cpf, empresa, telefone, email, senha }) 
                });

                const dados = await resposta.json();
                containerFimEl.classList.remove('container-fim-success');

                if (resposta.ok) {
                    pMessageEl.innerText = dados.resposta;
                    containerFimEl.classList.add('container-fim-success');
                    setTimeout(clearFormFields, 3000);
                } else {
                    pMessageEl.innerText = `Erro: ${dados.resposta || 'Falha desconhecida.'}`;
                    containerFimEl.classList.add('container-fim-error');
                }
            } catch (error) {
                containerFimEl.classList.remove('container-fim-success');
                containerFimEl.classList.add('container-fim-error'); 
                console.error('Erro de rede ou na requisição:', error);
                pMessageEl.innerText = "Erro de conexão. Verifique se o servidor está rodando na porta 3000.";
            }
        });
    </script>
</body>
</html>
