<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="container-respostas">
            <label for="nome">Nome</label>
            <input type="text" id="nome">
    <br>
    <br>
            <label for="email">Email</label>
            <input type="text" id="email">
    <br>
    <br>
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone">
    <br>
    <br>
            <label for="empresa">Empresa</label>
            <input type="text" id="empresa">
    <br>
    <br>
            <label for="assunto">Assunto</label>
            <input type="text" id="assunto">
    <br>
    <br>
            <label for="mensagem">Mensagem</label>
            <input type="text" id="mensagem">
            <div class="container-btn-resposta">
            <button id="btn_enviar" class="btn_enviar">Enviar</button>
            <p id="respostas" class="respostas"></p>
            <div class="quadrado"></div>
        </div>
    <div class="cabecalho"></div>
    </div>
    <div>
</body>
<script>

    //criar um evento para quando clicar no botão
    document.getElementById("btn_enviar").addEventListener("click",async()=>{
//primeira etapa - pegar as informações dos inputs
        const nome = document.getElementById("nome").value
        const email = document.getElementById("email").value
        const telefone = document.getElementById("telefone").value
        const empresa = document.getElementById("empresa").value
        const assunto = document.getElementById("assunto").value
        const mensagem = document.getElementById("mensagem").value
//segunda etapa - fazer a requisição para o back-end

        const resposta = await fetch(`http://localhost:3000/contato`,{
            method:"POST",
            headers:{
                "Accept":"application/json",
                "Content-Type":"application/json"
            },
            body:JSON.stringify({"nome":nome, "email":email, "telefone":telefone, "empresa":empresa, "assunto":assunto, "mensagem":mensagem})
        })

//terceira etapa - pegar a resposta do back-end
        if(resposta.ok == true){
    const dados = await resposta.json()
    document.getElementById("respostas").innerText = dados.resposta
        }else{

        }
    })

</script>
</html>
