<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="stylecad.css">
</head>
<body>
    <div class="container">
        <div class="cadastro">
            <div class="servicos-section">
            <img src="caminhao2.jpg" alt="Caminhão" class="caminhao2">
            <img src="aviao.jpg" alt="Avião" class="aviao">
                </div>
        </div>
        <div class="image"></div>
            <div class="quadrado">
                <div class="container-respostas">
                    <p class="lb_contrate">Contrate nosso <br> serviço</p>
                    <br>
                    <br>
                            <label for="empresa">Empresa</label>
                            <input type="text" id="empresa">
                    <br>
                    <br>
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone">
                    <br>
                    <br>
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf">
                    <br>
                    <br>
                            <label for="email">Email</label>
                            <input type="email" id="email">
                    <br>
                    <br>
                            <label for="senha">Senha</label>
                            <input type="password" id="senha">
                    <br>
                    <br>
                            <button id="btn_cadastrar" class="btn_cadastrar">Cadastrar</button>
                            <p id="respostas" class="respostas"></p>
                
            </div>
        </div>

        <div class="triangulo"></div>
        <div class="cabecalho">
            <nav class="nav-bar">
                <div class="logo">
                <img src="logo.png" alt="Rota-Certa Logística" class="logo-image">
                </div>
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li><a href="cadastro.html">Trabalhe Conosco</a></li>
                    <li class="login"><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
        </div>
        </div>
</body>
<script>

    //criar um evento para quando clicar no botão
    document.getElementById("btn_cadastrar").addEventListener("click",async()=>{
//primeira etapa - pegar as informações dos inputs
        const nome = document.getElementById("nome").value
        const email = document.getElementById("email").value
        const telefone = document.getElementById("telefone").value
        const empresa = document.getElementById("empresa").value
        const assunto = document.getElementById("assunto").value
        const mensagem = document.getElementById("mensagem").value
//segunda etapa - fazer a requisição para o back-end

        const resposta = await fetch(`http://localhost:3000/contato`,{
            method:"POST",
            headers:{
                "Accept":"application/json",
                "Content-Type":"application/json"
            },
            body:JSON.stringify({"nome":nome, "email":email, "telefone":telefone, "empresa":empresa, "assunto":assunto, "mensagem":mensagem})
        })

//terceira etapa - pegar a resposta do back-end
        if(resposta.ok == true){
    const dados = await resposta.json()
    document.getElementById("respostas").innerText = dados.resposta
        }else{

        }
    })

</script>
</html>
