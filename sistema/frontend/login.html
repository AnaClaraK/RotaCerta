<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="stylelog.css">
</head>
<body>
    <div class="container">
        <div class="quadrado">
            <h1 class="lb_login">Login</h1>
            <div class="container-respostas">
                <label for="email">E-mail</label>
                <input type="email" id="email">
        <br>
        <br>
                <label for="senha">Senha</label>
                <input type="password" id="senha">
                <p id="respostas" class="respostas"></p>
            </div>
            <button id="btn_entrar" class="btn_entrar">Entrar</button>
        </div>
        <div class="triangulo"></div>
        <div class="cabecalho">
            <nav class="nav-bar">
                <div class="logo">
                <img src="logo.png" alt="Rota-Certa Logística" class="logo-image">
                </div>
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li><a href="cadastro.html">Trabalhe Conosco</a></li>
                    <li class="login"><a href="login.html">Login</a></li>
                </ul>
            </nav>
        </div>
        </div>
</body>
<script>
    document.getElementById("btn_entrar").addEventListener("click",async()=>{
        const email = document.getElementById("email").value
        const senha = document.getElementById("senha").value
        const resposta = await fetch(`http://localhost:3000/login`,{
            method:"POST",
            headers:{
                "Accept":"application/json",
                "Content-Type":"application/json"
            },
            body:JSON.stringify({"email":email,"senha":senha})
        })

        if(resposta.ok == true){
    const dados = await resposta.json()
    document.getElementById("respostas").innerText = dados.resposta
        }else{

        }
    })
</script>
</html>
